<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOYER CRYPTO Exchange</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #0f172a);
            color: var(--tg-theme-text-color, #f8fafc);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .header {
            text-align: center;
            padding: 12px 0;
        }
        .header h1 {
            font-size: 22px;
            font-weight: 700;
            color: #38bdf8;
        }
        .card {
            background: var(--tg-theme-secondary-bg-color, #1e293b);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }
        .card-title {
            font-size: 16px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .rate-box {
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        .rate-label {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 4px;
        }
        .rate-value {
            font-size: 26px;
            font-weight: 800;
            color: #38bdf8;
        }
        .profile-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            font-size: 14px;
        }
        .profile-row:last-child {
            border-bottom: none;
        }
        .profile-label {
            color: #94a3b8;
        }
        .profile-value {
            font-weight: 600;
            color: #f8fafc;
        }
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px;
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s;
            cursor: pointer;
        }
        .btn:active {
            background: #0369a1;
        }
        .btn-secondary {
            background: #334155;
            color: #f8fafc;
        }
        .btn-secondary:active {
            background: #1e293b;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>SOYER CRYPTO APP</h1>
    </div>

    <!-- Розділ 1: Обмін -->
    <div class="card">
        <div class="card-title">💱 Курс обміну</div>
        <div class="rate-box">
            <div class="rate-label">Курс UAH ➡️ USDT</div>
            <div class="rate-value" id="rate">Оновлення...</div>
        </div>
        <a href="https://t.me/soyermanager" class="btn">📲 Написати менеджеру</a>
    </div>

    <!-- Розділ 2: Профіль -->
    <div class="card">
        <div class="card-title">👤 Мій профіль</div>
        <div class="profile-row">
            <span class="profile-label">Ім'я:</span>
            <span class="profile-value" id="user-name">Завантаження...</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">ID:</span>
            <span class="profile-value" id="user-id">—</span>
        </div>
        <div class="profile-row">
            <span class="profile-label">Username:</span>
            <span class="profile-value" id="user-username">—</span>
        </div>
    </div>

    <!-- Розділ 3: Канал -->
    <div class="card">
        <div class="card-title">📢 Офіційний канал</div>
        <a href="https://t.me/soyercrypto" class="btn btn-secondary">Перейти в SOYER CRYPTO</a>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            const user = tg.initDataUnsafe.user;
            document.getElementById('user-name').innerText = `${user.first_name || ''} ${user.last_name || ''}`.trim();
            document.getElementById('user-id').innerText = user.id;
            document.getElementById('user-username').innerText = user.username ? `@${user.username}` : 'Не вказано';
        }

        fetch('https://api.binance.com/api/v3/ticker/price?symbol=USDTUAH')
            .then(res => res.json())
            .then(data => {
                const price = parseFloat(data.price).toFixed(2);
                document.getElementById('rate').innerText = `1 USDT = ${price} UAH`;
            })
            .catch(() => {
                document.getElementById('rate').innerText = `1 USDT = 41.50 UAH`;
            });
    </script>
</body>
</html>
